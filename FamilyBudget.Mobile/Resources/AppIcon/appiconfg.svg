<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Cash bills fanned out behind the wallet -->
    <rect x="145" y="130" width="150" height="95" rx="10" fill="#66BB6A" transform="rotate(-8 220 177)" />
    <rect x="160" y="115" width="150" height="95" rx="10" fill="#4CAF50" transform="rotate(4 235 162)" />
    <rect x="150" y="120" width="150" height="95" rx="10" fill="#57B75C" transform="rotate(-2 225 167)" />

    <!-- Coin -->
    <circle cx="322" cy="150" r="40" fill="#F6C445" stroke="#E0A526" stroke-width="4" />
    <text x="322" y="163" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Rp</text>

    <!-- Wallet body -->
    <rect x="116" y="192" width="224" height="150" rx="26" fill="#6750A4" />
    <line x1="116" y1="224" x2="340" y2="224" stroke="#5A4494" stroke-width="3" stroke-dasharray="6,6" />

    <!-- Wallet clasp -->
    <rect x="312" y="256" width="42" height="30" rx="8" fill="#8874BE" />
    <circle cx="316" cy="271" r="10" fill="#FFFFFF" />

    <!-- House on the wallet face -->
    <polygon points="152,320 152,270 190,236 228,270 228,320" fill="#FFFFFF" />
</svg>
